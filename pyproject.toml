[project]
name = "kiari-plugins"
version = "0.1.0"
description = "Plugin implementations for kiari, loadable directly from GitHub"
authors = [
    { name = "kiarina", email = "kiarinadawa@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kiari>=0.2.0",
    "kiarina>=2.25.0",
]

# Per-command dependencies that kiari does not already pull in.
# Install with `uv sync --all-extras`, or `pip install "kiari-plugins[imageio]"`.
[project.optional-dependencies]
# firebase login
firebase-admin = [
    "firebase-admin>=7.5.0,<8",
]
# video-source --output-video
imageio = [
    "imageio>=2.37.4,<3",
]

[project.urls]
homepage = "https://github.com/kiarina/kiari-plugins"
repository = "https://github.com/kiarina/kiari-plugins"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
strict = true
exclude = ['^\.venv/']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long: let the formatter handle it (ignore long strings/comments)
    "B008",   # function call in argument defaults: required for FastAPI Depends()
    "RUF022", # unsorted __all__: keep intentional comment-based grouping
]

[tool.ruff.lint.isort]
known-first-party = ["kiari"]
combine-as-imports = true

[dependency-groups]
lint = [
    "mypy>=1.17.1,<3",
    "ruff>=0.15.0,<1",
]
dev = [
    "mypy>=1.17.1,<3",
    "ruff>=0.15.0,<1",
]
